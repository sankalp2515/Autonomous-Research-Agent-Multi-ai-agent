global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules — evaluated every evaluation_interval. Alerts surface in the
# Prometheus UI (/alerts) and, if an Alertmanager is wired, route onward.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # Scrapes the API's /metrics (custom LLM / gate / pipeline series live here).
  # This stack is a SEPARATE compose project, so it reaches the API over the
  # host, not a shared docker network. 8210 is the host-mapped API port.
  # If METRICS_TOKEN is set, add a bearer_token / bearer_token_file here.
  - job_name: veriscope-api
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8210"]
        labels:
          service: veriscope-api

  # The WORKER is where runs execute, so the gate, pipeline-node and most LLM
  # series are emitted there, not in the API. Before the worker had a /metrics
  # endpoint the trust alert (VeriscopeGateVerifiedFractionLow) only ever saw
  # the Ask path's claims. 8211 is the worker's host-mapped health port.
  - job_name: veriscope-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:8211", "host.docker.internal:8212", "host.docker.internal:8213"]
        labels:
          service: veriscope-worker

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
