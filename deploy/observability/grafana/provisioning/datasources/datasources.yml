apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      # Jump from a trace to its logs in Loki by run_id.
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: false
        tags: [{ key: "veriscope.run_id", value: "run_id" }]
