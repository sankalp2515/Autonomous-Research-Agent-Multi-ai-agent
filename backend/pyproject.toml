[project]
name = "research-agent-backend"
version = "0.1.0"
description = "Grounded research assistant - verification-gated multi-agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "redis>=5.0",
    "qdrant-client>=1.12,<1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "prometheus-client>=0.20",
    "langgraph>=0.2.60",
    "rank-bm25>=0.2.2",
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.3",
]
# Shared object-store library backend (BLOB_BACKEND=s3). Only needed in prod
# multi-node deployments; the default local backend needs nothing extra.
s3 = [
    "boto3>=1.34",
]
# OpenTelemetry distributed tracing (OTEL_ENABLED=true). Optional; the app
# degrades to a no-op when these aren't installed.
otel = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-instrumentation-redis>=0.48b0",
]
# Expose Veriscope as an MCP server (python -m app.mcp_server). Lets any MCP
# client (Claude Desktop, other agents) call the verification gate + research.
mcp = [
    "mcp>=1.2",
]
# LangSmith tracing (LANGSMITH_API_KEY set). LangGraph-native: node-level run
# tree + our LLM calls, no code change beyond init_langsmith(). Optional.
langsmith = [
    "langsmith>=0.1",
]
# RAGAS offline second-opinion eval (python -m evals.run_ragas). Judge = Groq
# (OpenAI-compatible), embeddings = local BGE. Needs the ml extra too.
ragas = [
    "ragas>=0.2",
    "langchain-openai>=0.2",
    "langchain-huggingface>=0.1",
    "datasets>=2.19",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
