[project]
name = "research-agent-backend"
version = "0.1.0"
description = "Grounded research assistant - verification-gated multi-agent backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "redis>=5.0",
    "qdrant-client>=1.12,<1.13",
    "httpx>=0.27",
    "tenacity>=9.0",
    "prometheus-client>=0.20",
    "langgraph>=0.2.60",
    "rank-bm25>=0.2.2",
    "pymupdf4llm>=0.0.17",
    "pymupdf>=1.24",
    "python-multipart>=0.0.9",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "transformers>=4.44",
    "torch>=2.3",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
