# ══════════════════════════════════════════════════════════════════════════
# Veriscope — observability stack (metrics, logs, traces).
#
# DELIBERATELY SEPARATE from docker-compose.yml. Running these five containers
# alongside the ML worker (~2GB of Torch models) OOM-killed a dev host (all
# containers exited 137). Keeping it a distinct compose project makes
# co-launching an explicit choice rather than an accident.
#
#   Run:   docker compose -f docker-compose.observability.yml up -d
#   Stop:  docker compose -f docker-compose.observability.yml down
#
# Requirements: ~2GB RAM free for this stack ALONE, on top of the app.
# Do not run it on a dev box that is also running the ML worker unless you
# have headroom (>=16GB total is comfortable).
#
# Wiring: this stack is a separate project, so it reaches the app over the
# HOST, not a shared docker network:
#   - Prometheus scrapes the API at host.docker.internal:8210
#     (Linux: run with --add-host=host.docker.internal:host-gateway)
#   - The app pushes OTLP traces to localhost:4318 (set in backend/.env:
#     OTEL_ENABLED=true, OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318)
#
# Grafana: http://localhost:3001 — anonymous admin for local convenience.
# LOCK THIS DOWN (set a password / disable anon) before exposing it anywhere.
# ══════════════════════════════════════════════════════════════════════════

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    extra_hosts:
      - "host.docker.internal:host-gateway"   # portability: Linux needs this
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prom_data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes:
      - ./deploy/observability/tempo.yml:/etc/tempo.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # query API
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (what the app exports to)
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.0
    command: ["-config.file=/etc/loki/loki-config.yml"]
    volumes:
      - ./deploy/observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.0
    command: ["-config.file=/etc/promtail/promtail-config.yml"]
    volumes:
      - ./deploy/observability/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_USERS_DEFAULT_THEME: "dark"
    volumes:
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
      - loki
      - tempo
    restart: unless-stopped

volumes:
  prom_data:
  tempo_data:
  loki_data:
  grafana_data:
