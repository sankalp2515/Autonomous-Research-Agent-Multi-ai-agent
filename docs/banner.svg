<svg width="860" height="200" viewBox="0 0 860 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Veriscope">
  <rect width="860" height="200" rx="20" fill="#16181d"/>
  <g transform="translate(48,56)">
    <rect width="56" height="56" rx="14" fill="#4f46e5"/>
    <path d="M16 29 l9 9 l16 -18" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="124" y="92" font-family="Georgia, serif" font-size="44" font-weight="600" fill="#f5f6f8">Veriscope</text>
  <text x="125" y="126" font-family="Inter, system-ui, sans-serif" font-size="18" fill="#8b93a1">Research you can prove — every claim quote-checked against its source.</text>
