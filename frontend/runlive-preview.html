<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#8c2f39" />
    <title>Veriscope — verifiable research</title>
    <meta
      name="description"
      content="A research workspace where every claim resolves to a real source, carries a verbatim quote, and passes an entailment check — or it isn't shown."
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph / Twitter — so shared report links render a real card
         instead of a bare URL in Slack / X / LinkedIn. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Veriscope" />
    <meta property="og:title" content="Veriscope — verifiable research" />
    <meta
      property="og:description"
      content="Every claim resolves to a real source, carries a verbatim quote, and passes an entailment check — or it isn't shown."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Veriscope — verifiable research" />
    <meta
      name="twitter:description"
      content="Every claim resolves to a real source, carries a verbatim quote, and passes an entailment check — or it isn't shown."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Type roles: Hanken Grotesk = UI chrome · Spectral = reading surface
         (serif) · JetBrains Mono = provenance / machine-verified meta. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/dev/RunLivePreview.tsx"></script>
  </body>
</html>
