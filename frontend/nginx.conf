# Serve the SPA and proxy the API to the backend container on the compose
# network. Single origin => no CORS, no VITE_API_TARGET at runtime.

# Conditional connection header: "upgrade" for WebSocket clients (the run-status
# WS), empty for everyone else so SSE keep-alive is preserved. Requests without
# an Upgrade header fall through to '' — no behaviour change for HTTP/SSE.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers (applied to every response, including the public
    # shared-report pages). always = emit even on error responses.
    add_header X-Content-Type-Options "nosniff" always;      # no MIME sniffing
    add_header X-Frame-Options "DENY" always;                # anti-clickjacking
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # HSTS: only meaningful over TLS; harmless on plain-HTTP local dev.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API → backend container. SSE (run progress) needs buffering off and a
    # long read timeout so the stream isn't cut mid-run.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # WebSocket upgrade (run-status WS) when requested; empty Connection for
        # SSE/HTTP so their keep-alive behaviour is unchanged.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }

    # SPA fallback: every non-file route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
