# Serve the SPA and proxy the API to the backend container on the compose
# network. Single origin => no CORS, no VITE_API_TARGET at runtime.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API → backend container. SSE (run progress) needs buffering off and a
    # long read timeout so the stream isn't cut mid-run.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1800s;
    }

    # SPA fallback: every non-file route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
