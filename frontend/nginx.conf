# Veriscope web tier. This is a TEMPLATE: the image's entrypoint runs envsubst
# over it at start-up, substituting only variables that are set in the
# environment (nginx's own $vars are left alone). Variables:
#
#   PORT            listen port. Cloud Run injects it (8080); compose sets 8080.
#   API_UPSTREAM    where /api goes. compose: http://api:8000.
#                   Cloud Run: the API service's https URL.
#   API_HOST        Host header for the upstream. compose: api. Cloud Run: the
#                   API service's hostname - Cloud Run routes on Host, so
#                   forwarding the browser's Host there returns a 404.
#
# On GCP the preferred topology is a load balancer routing /api/* straight to
# the API service, in which case this proxy is never hit. It stays so the same
# image works in compose and behind a single Cloud Run URL.

# Conditional connection header: "upgrade" for WebSocket clients (the run-status
# WS), empty for everyone else so SSE keep-alive is preserved.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen ${PORT};
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # PDF uploads go through /api. nginx's default body cap is 1MB, which made
    # every real paper upload fail here with a 413 before reaching the API.
    # Matches INGEST_MAX_PDF_MB (+1MB of multipart overhead).
    client_max_body_size 31m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain text/markdown;

    # Baseline security headers on every response, including the public
    # shared-report pages. `always` = also on error responses.
    #
    # CSP: scripts from this origin (Vite emits no inline script) plus Google's
    # API loader, which Identity Platform's Google sign-in uses; styles allow
    # 'unsafe-inline' for component style attributes; fonts from Google Fonts;
    # network calls to this origin, Identity Platform (identitytoolkit +
    # securetoken), Supabase auth (kept for the cut-over; drop after it), and
    # Sentry's ingest; frames only for the sign-in handler on the auth domain.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location = /livez {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # API -> backend. SSE (run progress) needs buffering off and a long read
    # timeout so the stream is not cut mid-run.
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host ${API_HOST};
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 300s;
    }

    # Content-hashed build assets: cache forever. A new deploy changes the
    # file names, so there is nothing to invalidate.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # index.html must never be cached, or a browser keeps requesting asset
    # names the new deploy no longer has and the app white-screens after
    # every release.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob: data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://*.supabase.co wss://*.supabase.co https://*.ingest.sentry.io https://*.ingest.us.sentry.io; frame-src https://*.firebaseapp.com https://accounts.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # SPA fallback: every non-file route resolves to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
