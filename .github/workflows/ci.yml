name: CI/CD

# Complete pipeline: lint + unit tests + migrations applied against real Postgres
# (backend), type-check + build (frontend), Playwright E2E (with an HTML report
# artifact), dependency + image vulnerability scanning, Docker image builds, and
# — only on main / tags — push to GHCR and deploy. Each job is a gate; a red job
# blocks the merge/release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after a successful release build"
        type: boolean
        default: false

# Least-privilege by default; the release job elevates to push packages and the
# scan job to upload SARIF.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend: lint, unit tests, migration chain ──────────────────────────
  backend:
    name: Backend · lint + tests + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The migration gate runs against the engine production uses. SQLite accepts
    # DDL that Postgres rejects, so a SQLite-only check can pass a migration that
    # breaks the deploy — the one place this pipeline must not be approximate.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app evals
      - name: Unit tests
        run: pytest -q
      - name: Migration chain resolves (Alembic)
        # Single linear head — catches the merge that leaves two.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
        run: |
          alembic history
          test "$(alembic heads | wc -l)" -eq 1
      - name: Migrations apply to a clean Postgres
        # `history` only proves the files import. This proves the DDL runs, which
        # is what the deploy's RUN_MIGRATIONS=1 entrypoint actually does.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
        run: alembic upgrade head

  # ── 2. Frontend: type-check + production build ──────────────────────────────
  frontend:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── 3. End-to-end (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (builds auth-off, mocks the API — no backend needed)
        run: npm run e2e
      - name: Upload HTML report (stakeholder-friendly)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  # ── 4. Supply chain: dependency + source scanning ──────────────────────────
  # Runs in parallel with the build gates — a vulnerable dependency should be
  # visible on the PR that introduces it, not discovered at deploy time.
  security:
    name: Security · dependency + secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the range
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        # Advisory, not blocking: a transitive CVE published upstream overnight
        # must not wall off every merge. It is surfaced in the log and in the
        # Dependabot PRs; a real fix is a dependency bump, not a red CI run on
        # code that changed nothing.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip install -e "."
          pip-audit --strict --progress-spinner off || true

      - name: npm audit (fails on high/critical only)
        working-directory: frontend
        # Blocking at high+: those are exploitable, few, and fixable by a bump.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        # A committed API key is the one finding that must stop the pipeline —
        # the repo ships .env.example precisely so real keys never land here.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Docker images build + image vulnerability scan ──────────────────────
  docker:
    name: Docker · build + scan images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (lean, no heavy ML)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          build-args: INSTALL_ML=0
          push: false
          load: true
          tags: veriscope-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: veriscope-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: veriscope-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true # a CVE with no upstream patch is not actionable here
          exit-code: "0" # report, don't block — base-image CVEs land without us
          format: table
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: veriscope-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ── 6. Release (CD): push images to GHCR — main + version tags ─────────────
  release:
    name: Release · push images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, security, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ghcr_repo: ${{ steps.meta.outputs.ghcr_repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        # GHCR rejects uppercase paths and `github.repository` preserves the
        # owner's casing, so it is lowercased here rather than at each use site.
        # The commit SHA is the deployable identity: `latest` moves, a SHA does
        # not, and a rollback is "deploy the previous SHA".
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          tags_backend="$repo/backend:${GITHUB_SHA}"
          tags_frontend="$repo/frontend:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags_backend="$tags_backend"$'\n'"$repo/backend:latest"
            tags_frontend="$tags_frontend"$'\n'"$repo/frontend:latest"
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/}"
              tags_backend="$tags_backend"$'\n'"$repo/backend:${v}"
              tags_frontend="$tags_frontend"$'\n'"$repo/frontend:${v}"
              ;;
          esac
          {
            echo "backend_tags<<EOF"; echo "$tags_backend"; echo "EOF"
            echo "frontend_tags<<EOF"; echo "$tags_frontend"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
      - name: Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.backend_tags }}"
            echo "${{ steps.meta.outputs.frontend_tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 7. Deploy (CD): pull the released images on the host ───────────────────
  # Self-disabling: with no DEPLOY_HOST secret configured the job reports that
  # the pipeline stops at the registry and exits green. A deploy step that fails
  # because nobody has chosen a host yet would train everyone to ignore red.
  deploy:
    name: Deploy · roll out to the host
    runs-on: ubuntu-latest
    needs: release
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.deploy
    environment: production # gate approvals/secrets here in repo settings
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy target is configured
        id: gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "No DEPLOY_HOST secret — CD stops at GHCR." >> "$GITHUB_STEP_SUMMARY"
            echo "See docs/CICD.md § Deploy to enable it." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install SSH key
        if: steps.gate.outputs.configured == 'true'
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # Pinned host key, never `StrictHostKeyChecking=no`: TOFU over a public
          # runner is an unauthenticated first connection to a box we then hand a
          # deploy to. Generate with: ssh-keyscan -H <host>
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Pull + roll out (pinned to this commit's images)
        if: steps.gate.outputs.configured == 'true'
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_REPO: ${{ needs.release.outputs.ghcr_repo }}
          IMAGE_TAG: ${{ needs.release.outputs.image_tag }}
        run: |
          ssh -o BatchMode=yes "${USER_NAME}@${HOST}" bash -se <<EOSSH
          set -euo pipefail
          cd "${DEPLOY_PATH}"
          git fetch --all --prune
          git checkout --force ${{ github.sha }}
          export GHCR_REPO="${GHCR_REPO}" IMAGE_TAG="${IMAGE_TAG}"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            docker login ghcr.io -u ${{ github.actor }} --password-stdin
          COMPOSE="docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml --profile app"
          \$COMPOSE pull
          # api carries RUN_MIGRATIONS=1, so `up -d` applies alembic upgrade head
          # once, before it serves. See deploy/docker-compose.prod.yml.
          \$COMPOSE up -d --remove-orphans
          docker image prune -f
          EOSSH

      - name: Smoke test (the deploy is not done until the app answers)
        if: steps.gate.outputs.configured == 'true'
        env:
          HEALTH_URL: ${{ secrets.DEPLOY_HEALTH_URL }}
        run: |
          if [ -z "$HEALTH_URL" ]; then
            echo "::warning::DEPLOY_HEALTH_URL not set — rollout unverified."
            exit 0
          fi
          for i in $(seq 1 30); do
            code=$(curl -fsS -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            if [ "$code" = "200" ]; then
              echo "healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Health check never returned 200 at $HEALTH_URL."
          echo "Roll back: re-run this workflow from the previous green commit," >> "$GITHUB_STEP_SUMMARY"
          echo "or on the host set IMAGE_TAG=<previous sha> and re-run compose up -d." >> "$GITHUB_STEP_SUMMARY"
          exit 1
