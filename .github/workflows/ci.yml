name: CI/CD

# Complete pipeline: lint + unit tests + migrations applied against real Postgres
# (backend), type-check + build (frontend), Playwright E2E (with an HTML report
# artifact), dependency + image vulnerability scanning, Docker image builds, and
# — only on main / tags — push to GHCR and deploy. Each job is a gate; a red job
# blocks the merge/release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy after a successful release build"
        type: boolean
        default: false

# Least-privilege by default; the release job elevates to push packages and the
# scan job to upload SARIF.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Backend: lint, unit tests, migration chain ──────────────────────────
  backend:
    name: Backend · lint + tests + migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The migration gate runs against the engine production uses. SQLite accepts
    # DDL that Postgres rejects, so a SQLite-only check can pass a migration that
    # breaks the deploy — the one place this pipeline must not be approximate.
    services:
      postgres:
        # The production engine: Postgres 16 WITH pgvector (Cloud SQL ships it).
        # Migration 0007 creates the extension and a vector column; a plain
        # postgres image would fail it, and so should CI.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: research
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check app evals
      - name: Unit tests
        run: pytest -q
      - name: Migration chain resolves (Alembic)
        # Single linear head — catches the merge that leaves two.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
        run: |
          alembic history
          test "$(alembic heads | wc -l)" -eq 1
      - name: Migrations apply to a clean Postgres
        # `history` only proves the files import. This proves the DDL runs, which
        # is what the deploy's RUN_MIGRATIONS=1 entrypoint actually does.
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
        run: alembic upgrade head
      - name: Migrations are re-runnable and reversible one step
        # Every revision is written idempotent; prove it, and prove the newest
        # one can be rolled back and re-applied (the rollback runbook depends
        # on exactly that).
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head
      - name: Integration tests against real Postgres + pgvector
        # The unit suite runs on SQLite; these exercise the SQL that only
        # Postgres can run (vector casts, <=> ordering, savepoints).
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/research
        run: pytest -q -m integration

  # ── 2. Frontend: type-check + production build ──────────────────────────────
  frontend:
    name: Frontend · type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  # ── 3. End-to-end (Playwright) ─────────────────────────────────────────────
  e2e:
    name: E2E · Playwright
    runs-on: ubuntu-latest
    needs: frontend
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run E2E (builds auth-off, mocks the API — no backend needed)
        run: npm run e2e
      - name: Upload HTML report (stakeholder-friendly)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 14

  # ── 4. Supply chain: dependency + source scanning ──────────────────────────
  # Runs in parallel with the build gates — a vulnerable dependency should be
  # visible on the PR that introduces it, not discovered at deploy time.
  security:
    name: Security · dependency + secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs history to scan the range
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Python dependency audit (pip-audit)
        working-directory: backend
        # Advisory, not blocking: a transitive CVE published upstream overnight
        # must not wall off every merge. It is surfaced in the log and in the
        # Dependabot PRs; a real fix is a dependency bump, not a red CI run on
        # code that changed nothing.
        continue-on-error: true
        # Advisory but VISIBLE: the old `|| true` inside a continue-on-error
        # step meant the step could never even turn yellow. Findings now show
        # as a warning annotation on the run.
        run: |
          pip install pip-audit
          pip install -e ".[gcp]"
          pip-audit --progress-spinner off || echo "::warning::pip-audit reported vulnerable dependencies (see log)"

      - name: npm audit (fails on high/critical only)
        working-directory: frontend
        # Blocking at high+: those are exploitable, few, and fixable by a bump.
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Secret scan (gitleaks)
        # A committed API key is the one finding that must stop the pipeline —
        # the repo ships .env.example precisely so real keys never land here.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 5. Docker images build + image vulnerability scan ──────────────────────
  docker:
    name: Docker · build + scan images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (the production build, ML + baked models)
        # This used to build INSTALL_ML=0 while release pushed the full ML
        # image - so the image users ran was never the image that was scanned.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: veriscope-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: veriscope-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image runs as non-root and answers /livez
        run: |
          test "$(docker inspect -f '{{.Config.User}}' veriscope-backend:ci)" = "10001:10001"
          docker run -d --name smoke -e APP_ENV=dev -e ML_NLI_ENABLED=false \
            -e DATABASE_URL=postgresql+asyncpg://nobody:x@127.0.0.1:1/none \
            -p 18000:8000 veriscope-backend:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:18000/livez && exit 0
            sleep 2
          done
          docker logs smoke; exit 1
      - name: Scan backend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: veriscope-backend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true # a CVE with no upstream patch is not actionable here
          exit-code: "0" # report, don't block — base-image CVEs land without us
          format: table
      - name: Scan frontend image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: veriscope-frontend:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
          format: table

  # ── 6. Release (CD): push images to GHCR — main + version tags ─────────────
  release:
    name: Release · push images to GHCR
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, security, docker]
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      ghcr_repo: ${{ steps.meta.outputs.ghcr_repo }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        # GHCR rejects uppercase paths and `github.repository` preserves the
        # owner's casing, so it is lowercased here rather than at each use site.
        # The commit SHA is the deployable identity: `latest` moves, a SHA does
        # not, and a rollback is "deploy the previous SHA".
        run: |
          repo="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_repo=$repo" >> "$GITHUB_OUTPUT"
          echo "image_tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          tags_backend="$repo/backend:${GITHUB_SHA}"
          tags_frontend="$repo/frontend:${GITHUB_SHA}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            tags_backend="$tags_backend"$'\n'"$repo/backend:latest"
            tags_frontend="$tags_frontend"$'\n'"$repo/frontend:latest"
          fi
          case "${GITHUB_REF}" in
            refs/tags/v*)
              v="${GITHUB_REF#refs/tags/}"
              tags_backend="$tags_backend"$'\n'"$repo/backend:${v}"
              tags_frontend="$tags_frontend"$'\n'"$repo/frontend:${v}"
              ;;
          esac
          {
            echo "backend_tags<<EOF"; echo "$tags_backend"; echo "EOF"
            echo "frontend_tags<<EOF"; echo "$tags_frontend"; echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.backend_tags }}
          cache-from: type=gha
      - name: Push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.meta.outputs.frontend_tags }}
          cache-from: type=gha
          # Sign-in values are public (browser key, project id), kept in
          # repository VARIABLES not secrets; the Supabase pair stays only for
          # the cut-over and is dropped after it (docs/RUNBOOK.md).
          build-args: |
            VITE_AUTH_PROVIDER=${{ vars.VITE_AUTH_PROVIDER }}
            VITE_IDP_API_KEY=${{ vars.VITE_IDP_API_KEY }}
            VITE_IDP_AUTH_DOMAIN=${{ vars.VITE_IDP_AUTH_DOMAIN }}
            VITE_IDP_PROJECT_ID=${{ vars.VITE_IDP_PROJECT_ID }}
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_SENTRY_DSN=${{ secrets.VITE_SENTRY_DSN }}
            VITE_RELEASE=${{ github.sha }}

      - name: Summary
        run: |
          {
            echo "### Images pushed"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.backend_tags }}"
            echo "${{ steps.meta.outputs.frontend_tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ── 7. Infra: Terraform formats and validates ──────────────────────────────
  infra:
    name: Infra · terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  # ── 8. Deploy (CD): promote the released images to Cloud Run ───────────────
  # Self-disabling: until the GCP_* repository variables exist (outputs of
  # `terraform apply` in infra/gcp) the job reports that CD stops at the
  # registry and exits green. A deploy step that fails because nobody has
  # provisioned the target yet would train everyone to ignore red.
  #
  # No key file anywhere: GitHub's OIDC token is exchanged for a short-lived
  # credential through Workload Identity Federation, restricted (in Terraform)
  # to this repository's main branch and version tags.
  deploy:
    name: Deploy · Cloud Run (migrate, roll out, verify)
    runs-on: ubuntu-latest
    needs: [release, infra]
    if: >-
      github.ref == 'refs/heads/main' ||
      startsWith(github.ref, 'refs/tags/v') ||
      inputs.deploy
    environment: production # approvals gate here (repo Settings -> Environments)
    permissions:
      contents: read
      id-token: write # OIDC token for Workload Identity Federation
    concurrency:
      group: deploy-production
      cancel-in-progress: false # never interrupt a rollout half-way
    env:
      PROJECT: ${{ vars.GCP_PROJECT_ID }}
      REGION: ${{ vars.GCP_REGION }}
      GHCR_REPO: ${{ needs.release.outputs.ghcr_repo }}
      TAG: ${{ needs.release.outputs.image_tag }}
    steps:
      - name: Check the deploy target is configured
        id: gate
        run: |
          if [ -z "${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}" ] || [ -z "$PROJECT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "GCP_* repository variables not set — CD stops at GHCR." >> "$GITHUB_STEP_SUMMARY"
            echo "See infra/gcp/README.md § Connect CI." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Authenticate to Google Cloud (WIF)
        if: steps.gate.outputs.configured == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        if: steps.gate.outputs.configured == 'true'

      - name: Promote the scanned images (same digest) to Artifact Registry
        # Retag, never rebuild: the bytes that serve users are the bytes the
        # gates above passed.
        if: steps.gate.outputs.configured == 'true'
        run: |
          AR="${REGION}-docker.pkg.dev/${PROJECT}/veriscope"
          echo "AR=$AR" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          for img in backend frontend; do
            docker pull "${GHCR_REPO}/${img}:${TAG}"
            docker tag  "${GHCR_REPO}/${img}:${TAG}" "${AR}/${img}:${TAG}"
            docker push "${AR}/${img}:${TAG}"
          done

      - name: Migrate (Cloud Run Job, before any new revision takes traffic)
        if: steps.gate.outputs.configured == 'true'
        run: |
          gcloud run jobs update veriscope-migrate --region "$REGION" \
            --image "${AR}/backend:${TAG}" --quiet
          gcloud run jobs execute veriscope-migrate --region "$REGION" --wait

      - name: Roll out worker, api, web
        if: steps.gate.outputs.configured == 'true'
        run: |
          for svc in worker api; do
            gcloud run deploy "veriscope-${svc}" --region "$REGION" \
              --image "${AR}/backend:${TAG}" \
              --update-env-vars "APP_VERSION=${TAG}" --quiet
          done
          gcloud run deploy veriscope-web --region "$REGION" \
            --image "${AR}/frontend:${TAG}" --quiet

      - name: Verify (the deploy is not done until the app answers)
        if: steps.gate.outputs.configured == 'true'
        run: |
          API=$(gcloud run services describe veriscope-api --region "$REGION" --format 'value(status.url)')
          WEB=$(gcloud run services describe veriscope-web --region "$REGION" --format 'value(status.url)')
          for url in "$API/readyz" "$WEB/livez" "$WEB/api/health"; do
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS -o /dev/null "$url"; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "::error::$url never became ready."
              {
                echo "### Deploy verification failed at $url"
                echo "Roll back each service to its previous revision:"
                echo '```'
                echo "gcloud run services update-traffic veriscope-api --region $REGION --to-revisions=PREVIOUS_REVISION=100"
                echo '```'
                echo "Migrations are expand-only (docs/RUNBOOK.md), so the previous revision runs on the new schema."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done
          echo "Deployed ${TAG}: $WEB" >> "$GITHUB_STEP_SUMMARY"
