name: Groundedness eval gate

# Manual / scheduled: spins up infra, runs the groundedness harness, and fails
# if a release gate is breached (fabricated citations > 0, support < 98%,
# refusal correctness < 95%). Requires LLM keys in repo secrets.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

jobs:
  evals:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: research }
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
      qdrant:
        image: qdrant/qdrant:v1.12.4
        ports: ["6333:6333"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -e ".[ml]"
      - name: Run eval gate
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5433/research
          REDIS_URL: redis://localhost:6380/0
          QDRANT_URL: http://localhost:6333
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m evals.run_evals
