# ══════════════════════════════════════════════════════════════════════════
# DEVELOPMENT overrides — auto-loaded by `docker compose` (by convention,
# never used in production; deploy with an explicit
# `docker compose -f docker-compose.yml ...`).
#
# Why this exists: a containerized worker running a baked image silently
# executes STALE code after every edit. That invalidated three separate
# verification runs before it was noticed. Bind-mounting the source means a
# container restart (seconds) picks up changes — no image rebuild, no
# 2GB Torch re-download, no stale-code class of bug.
#
#   Apply changes:  docker compose --profile app restart worker api
# ══════════════════════════════════════════════════════════════════════════

services:
  api:
    volumes:
      # Live source. Dependencies stay in the image's site-packages; the
      # editable install already points at /app.
      - ./backend/app:/app/app:ro
    environment:
      LOG_FORMAT: console          # readable logs while developing

  # The inference tier was the one service WITHOUT a source mount, so it kept
  # running the baked image while api and worker picked up edits on restart —
  # the exact stale-code trap this file exists to prevent, just one service
  # further down. Symptom: model_server.py changes (thread pinning, startup
  # warmup) appeared to do nothing, while compose-level env changes worked,
  # because only the latter reach a baked image.
  models:
    volumes:
      - ./backend/app:/app/app:ro
    environment:
      LOG_FORMAT: console

  worker:
    volumes:
      - ./backend/app:/app/app:ro
    environment:
      LOG_FORMAT: console
      # NOTE: RESEARCH_MAX_PAPERS was pinned to "10" here as a "temporary"
      # diagnostic override and never removed — every run since was capped at a
      # 10-paper corpus, which is most of why reports read thin. Removed; the
      # app default (config.research_max_papers) is authoritative again.
